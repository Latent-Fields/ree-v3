name: Cloud Worker Scaler
# Auto-starts each Hetzner cloud worker when experiments matching its
# machine_affinity are queued, stops it when no matching work remains.
#
# AUTHORITY MIGRATED 2026-05-31: the primary scaler now runs as a systemd
# timer on the coordinator hub (ree-worker-1) -- see
# ree-v3/coordinator/deploy/cloud-scaler.{py,service,timer,md}. The hub
# timer fires every 5 minutes on the wall clock; this GHA workflow has
# been downgraded to a 6-hourly backstop that only recovers a wedged hub.
# Motivation: GHA scheduled-workflow gaps observed as 60-273 minutes
# under load, leaving idle cloud workers running 1-4 hours past
# IDLE_GRACE_MIN=20. The hub timer's cadence is reliable; if the hub is
# itself down for hours, this 6-hourly backstop still catches forgotten
# workers.
#
# TRANSPORT PARITY (2026-08-19): the two transports are NOT automatically
# identical -- this header claimed "identical 1:1" while the hub scaler had
# grown two shutdown vetoes this workflow lacked, and the drift powered off a
# live box. On 2026-08-19T01:39:26Z this backstop shut down ree-worker-4
# (reason=heartbeat_stale) while it was serving as the RESIDENT
# metaworker-dispatch box with 2 dispatches in flight and 80 open chips; the
# hub timer had correctly vetoed the same box minutes earlier. Nothing noticed
# for ~15h. The orchestrator veto is now ported here (below). TWO divergences
# REMAIN, both STRUCTURAL, not drift, and both for the same reason: this
# workflow runs on a GitHub-hosted runner that cannot reach anything on the
# hub's own disk or on the WireGuard mesh.
#   (a) the pytest lease veto reads /home/ree/pytest_leases on the hub;
#   (b) the hub timer's orchestrator veto is COORDINATOR-PRIMARY (2026-08-19)
#       and its bootstrap wake hold reads hub-local state. Neither is
#       reachable from here. Since 2026-09-01 this path reads the
#       `live-status` branch snapshot (fleet_status.json -- the coordinator
#       /shadow/status rows, republished every ~3 min), which replaced the
#       retired master-branch heartbeat mirror and is far fresher; but it is
#       still a hub-published mirror that freezes when the hub is down, so
#       the asymmetry stands: this backstop holds no shutdown authority over
#       a declared orchestrator box at all. See env.ORCHESTRATOR_AFFINITIES.
# Divergence (a) is safe in the only direction that matters -- this backstop
# can shut a box down that the hub would have kept up, never the reverse.
# Divergence (b) is deliberately the OPPOSITE direction, and that asymmetry is
# the point: for a box whose liveness only the fresh transport can see, the
# stale transport must lose. Both are why "1:1" must not be re-asserted
# without checking.
# coordinator/test_cloud_scaler_transport_parity.py pins the vetoes that CAN
# be shared, so the next one added to cloud-scaler.py fails a test rather than
# silently killing a box.
#
# Orchestrator veto: a scaler-managed box may ALSO run metaworker-dispatch.
# That work creates no queue claim and no runner heartbeat, so every other
# signal here reads clean_idle while live `claude -p` workers are mid-flight.
# The box publishes a role=orchestrator heartbeat under
# "<affinity>-metaworker.json" in the runner_heartbeats sparse checkout this
# workflow already pulls. It vetoes shutdown when in_flight_dispatches > 0
# (strong: live workers) or chips_open_work > 0 (weak: backlog it would pick
# up next tick). An orchestrator that is idle AND has an empty ledger does NOT
# veto -- so the box is stopped only when BOTH planes (experiment queue and
# durable chip ledger) are empty, which is the demand-sensitive behaviour the
# user asked for on 2026-08-19. Fails OPEN in every direction.
#
# Routing rules (per worker):
#   - "claimable" items = status==pending AND machine_affinity in {any, <server_affinity>}
#   - mode "full" (default): server off + claimable > 0 -> poweron
#   - mode "shutdown-only": never auto-starts; must be powered on manually
#   - mode "surge": auto-start only when (claimable >= SURGE_QUEUE_THRESHOLD)
#       AND (cloud-2 + cloud-3 are both running with held claims). Designed
#       so cloud-4 acts as overflow capacity behind cloud-2/3, taking on
#       work that would otherwise pull in the laptop (DLAPTOP-4.local). See
#       Lever 2 in the "prefer cloud over laptop" proposal 2026-05-31.
#   - server running + claimable == 0 + heartbeat says idle + last completed > IDLE_GRACE_MIN ago
#       -> shutdown (graceful, drains current run) [applies to all modes]
#
# The heartbeat gate prevents the race where the queue momentarily reads zero
# pending items because the runner has just claimed an item and is mid-experiment;
# without it, the scaler would issue SIGTERM mid-manifest-write (the V3-EXQ-244a /
# V3-EXQ-541 SIGTERM signature). The recent_completed gate adds a second layer:
# even if the heartbeat shows idle, we wait IDLE_GRACE_MIN after the last
# completed experiment before powering off, so a back-to-back claim has time to
# land before the box goes down.
#
# Active-claim guard (2026-05-30): the heartbeat gate alone is not enough. If a
# worker is mid-experiment AND its heartbeat has gone >1h stale (broken heartbeat
# flow, long synchronous step, or post-result-push-pre-next-claim window), the
# stale branch sets idle_ok=1 reason=heartbeat_stale -- and the pending-only
# CLAIMABLE count is zero because the worker has already claimed its item, so
# the worker is shut down mid-run. Authoritative invariant: a worker with a
# claimed-and-not-completed item never gets shut down. Implemented via the
# HELD_BY_SELF count below, gated before any shutdown branch.

on:
  schedule:
    # 6-hourly backstop. Hub timer is authoritative (every 5 min on the
    # wall clock); see workflow header for migration notes 2026-05-31.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}       # manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IDLE_GRACE_MIN: 20          # min minutes since last completed before shutdown
  # HEARTBEAT_FRESH_MIN was 5 (assumed every-tick file refresh), then 35
  # (tuned to the state-change-lagged master heartbeat mirror). Since
  # 2026-09-01 the source is the live-status snapshot whose per-row
  # last_seen is DB-fresh at publish time (~3-min republish cadence), so 35
  # is now generous rather than tight -- kept as-is because it also absorbs
  # live-status publish hiccups and GHA checkout lag, and loosening it has
  # no cost (the hub timer is authoritative at 5-min cadence).
  HEARTBEAT_FRESH_MIN: 35     # last_seen must be at most this many minutes stale
  SURGE_QUEUE_THRESHOLD: 2    # claimable items required before a surge-mode worker is powered on (lowered 3->2 on 2026-06-01: wake cloud-4 overflow before pulling in the laptop; sister-worker saturation pre-check still gates power-on)
  # The coordinator hub VM must NEVER be considered for shutdown by the scaler.
  # ree-worker-1 runs ree-coordinator + ree-sync-daemon at 10.8.0.1:8787 (the
  # Phase-3 git writer hub). On 2026-05-28 the scaler powered the hub off
  # because cloud-1's ree-runner was systemctl-disabled (separate hub/runner
  # co-location fix), so the scaler saw the VM as an idle worker. Recovery
  # required `hcloud server poweron ree-worker-1` + manually disabling this
  # workflow. The HUB_NAME guard in the loop body skips the hub before any
  # shutdown decision can be made. If the hub ever moves to a different VM,
  # update HUB_NAME here AND on the hub VM itself (hostname + coordinator/
  # sync-daemon systemd units).
  HUB_NAME: ree-worker-1
  # Max age of the role=orchestrator heartbeat before it stops vetoing.
  # 50 IS ARITHMETIC, NOT A ROUND NUMBER -- it must exceed
  # scripts/ree_metaworker_heartbeat.py's LIVENESS_FLOOR_MINUTES (30), below
  # which a healthy-but-unchanging box ages out of its own veto on schedule,
  # plus ~13min observed worst-case git propagation lag plus ~7min margin.
  # MUST stay equal to DEFAULTS["ORCHESTRATOR_FRESH_MIN"] in
  # coordinator/deploy/cloud-scaler.py; the parity test pins that.
  ORCHESTRATOR_FRESH_MIN: 50
  # RESIDENT ORCHESTRATOR BOXES -- space-separated affinities on which
  # metaworker-dispatch is installed. MUST stay equal to
  # ORCHESTRATOR_AFFINITIES in coordinator/deploy/cloud-scaler.py; the parity
  # test pins that.
  #
  # THIS BACKSTOP NEVER SHUTS THESE BOXES DOWN -- a DELIBERATE, DOCUMENTED
  # DIVERGENCE from the hub timer, not drift, and the second such divergence
  # after the pytest lease (see the header). The reason is transport, and it
  # is the same reason this whole file was wrong on 2026-08-19:
  #
  #   The hub timer decides from the COORDINATOR (/shadow/status,
  #   DB-authoritative, sub-second, and reachable only over WireGuard). A
  #   GitHub-hosted runner cannot reach 10.8.0.1, so this path can only ever
  #   read the GIT heartbeat -- the channel CLAUDE.md documents as
  #   deliberately stale (state-change commits only, liveness tick retired).
  #   It also cannot see the hub-local wake state that breaks the bootstrap
  #   deadlock, so it cannot tell a BOOTING orchestrator from a dead one.
  #
  # On 2026-08-19T01:39:26Z this path powered ree-cloud-4 off with 2
  # dispatches in flight and 80 open chips, on reason=heartbeat_stale, and
  # nothing noticed for ~15h. A 6-hourly backstop reading the stale transport
  # must not hold shutdown authority over a box whose liveness only the fresh
  # transport can see. It keeps FULL power-ON authority; only the shutdown
  # branch is withheld. The hub timer runs every ~5 minutes and remains fully
  # authoritative for these boxes, including shutting them down when both
  # planes are genuinely empty.
  ORCHESTRATOR_AFFINITIES: ree-cloud-4

jobs:
  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: experiment_queue.json
          path: ree-v3

      # TELEMETRY SOURCE MIGRATED 2026-09-01 (git-traffic simplification
      # sweep): the master-branch runner_heartbeats/ mirror is RETIRED
      # (PHASE3_HEARTBEAT_GIT_MATERIALIZE=0 on the hub sync-daemon). This
      # backstop now reads the `live-status` branch -- an orphan,
      # force-updated single commit the hub's live-status-writer publishes
      # every ~3 min from the coordinator DB (fleet_status.json carries the
      # full /shadow/status machine rows). Same trust model as before (a
      # hub-written git mirror), but sub-minute fresh instead of
      # state-change-lagged, and zero permanent git history. When the hub is
      # down the snapshot freezes -- exactly as the old mirror did (it was
      # hub-written too), so per-row last_seen ages carry the same
      # dead-vs-aging semantics as before.
      - uses: actions/checkout@v4
        with:
          repository: Latent-Fields/REE_assembly
          ref: live-status
          path: ree-assembly-live

      - name: Set up hub SSH key (best-effort shutdown_notify announcer)
        # Optional: when HUB_SSH_KEY is set, the scaler can SSH into the
        # coordinator hub and POST /shutdown_notify before issuing
        # `hcloud server shutdown`. This lets /shadow/status return
        # lifecycle_state=gracefully_offline instead of stale for surge-
        # pool workers, so preflight gates and the explorer UI distinguish
        # "intentionally offline" from "silent failure."
        # Without HUB_SSH_KEY the workflow runs exactly as before
        # (shutdown announcement skipped; lifecycle_state stays stale until
        # the watchdog window expires).
        env:
          HUB_SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
        run: |
          if [ -z "${HUB_SSH_KEY:-}" ]; then
            echo "[scaler] HUB_SSH_KEY not configured -- shutdown_notify announces will be skipped"
            echo "HUB_SSH_READY=0" >> $GITHUB_ENV
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$HUB_SSH_KEY" > ~/.ssh/hub_key
          chmod 600 ~/.ssh/hub_key
          # Pin hub host key to avoid TOFU on every run; HUB_SSH_HOST_KEY
          # secret holds one or more lines from `ssh-keyscan <hub-ip>`.
          # When absent we fall back to StrictHostKeyChecking=no -- this
          # workflow's threat model already trusts the GH-secrets surface;
          # the announcement payload itself is non-sensitive.
          if [ -n "${{ secrets.HUB_SSH_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.HUB_SSH_HOST_KEY }}" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi
          echo "HUB_SSH_READY=1" >> $GITHUB_ENV

      - name: Check queue + heartbeats and scale cloud workers
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HUB_SSH_USER: ${{ vars.HUB_SSH_USER || 'ree' }}
          HUB_SSH_HOST: ${{ vars.HUB_SSH_HOST || '91.98.130.117' }}
        run: |
          set -euo pipefail

          # Install hcloud CLI
          HCLOUD_VERSION="v1.43.0"
          curl -sL "https://github.com/hetznercloud/cli/releases/download/${HCLOUD_VERSION}/hcloud-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin hcloud

          # server_name:affinity[:mode] pairs -- add more workers by extending this list
          # mode "shutdown-only" = auto-shutdown when idle but never auto-start
          # mode "surge"         = auto-start only when cloud-2 + cloud-3 saturated
          #                        AND claimable >= SURGE_QUEUE_THRESHOLD
          WORKERS=(
            "ree-worker-1:ree-cloud-1"
            "ree-worker-2:ree-cloud-2"
            "ree-worker-3:ree-cloud-3"
            "ree-worker-4:ree-cloud-4:surge"
          )

          # Track per-affinity state across the loop so the surge-mode branch
          # can read sister-worker status (cloud-2 + cloud-3) when deciding
          # whether to power on cloud-4. Bash associative arrays require
          # `declare -A`; ordering of the WORKERS list guarantees cloud-2 and
          # cloud-3 iterate before cloud-4.
          declare -A WORKER_STATUS=()
          declare -A WORKER_HELD=()

          for entry in "${WORKERS[@]}"; do
            IFS=: read -r SERVER_NAME AFFINITY MODE <<< "$entry"
            MODE="${MODE:-full}"

            # HUB GUARD: the coordinator hub VM must never be powered off by
            # the scaler. Skip the entire iteration -- no status read, no
            # power-on, no shutdown decision. See env.HUB_NAME comment above
            # for the 2026-05-28 incident this guards against.
            if [ "$SERVER_NAME" = "$HUB_NAME" ]; then
              echo "[$SERVER_NAME affinity=$AFFINITY] HUB_NAME match -- scaler skips hub VM (no power-on, no shutdown)"
              continue
            fi

            # Count pending items this worker could claim (its affinity or "any")
            CLAIMABLE=$(AFFINITY="$AFFINITY" python3 -c "
          import json, os
          aff = os.environ['AFFINITY']
          q = json.load(open('ree-v3/experiment_queue.json'))
          n = sum(
              1 for i in q.get('items', [])
              if i.get('status') == 'pending'
              and i.get('machine_affinity') in ('any', aff)
          )
          print(n)
          ")

            # Count items this worker is currently CLAIMED on. Without this,
            # a worker that has just transitioned a pending item to claimed
            # is invisible to the pending-only CLAIMABLE count above, so on
            # the next 15-min tick (with heartbeat possibly stale because a
            # long experiment hasn't refreshed it) the scaler would shut
            # it down mid-claim. This is the 2026-05-30 fleet incident
            # (V3-EXQ-483e on cloud-2, V3-EXQ-614a on cloud-3 powered off
            # mid-run). Treat any held claim as work-in-flight: do NOT
            # shutdown while the held count is > 0, regardless of idle
            # gate or heartbeat staleness. The held count and the pending
            # count are kept as separate diagnostics so the log line shows
            # which path is keeping the worker alive.
            HELD_BY_SELF=$(AFFINITY="$AFFINITY" python3 -c "
          import json, os
          aff = os.environ['AFFINITY']
          q = json.load(open('ree-v3/experiment_queue.json'))
          n = 0
          for i in q.get('items', []):
              if i.get('status') != 'claimed':
                  continue
              cb = i.get('claimed_by') or {}
              # claimed_by is the canonical nested form ({machine, claimed_at});
              # accept a bare string form as a fallback for legacy queue entries.
              machine = cb.get('machine') if isinstance(cb, dict) else cb
              if machine == aff:
                  n += 1
          print(n)
          ")

            # ORCHESTRATOR VETO INPUT. Mirrors read_orchestrator() in
            # coordinator/deploy/cloud-scaler.py. A box co-running
            # metaworker-dispatch publishes role=orchestrator under
            # "<affinity>-metaworker.json". FAILS OPEN in every direction
            # (missing dir/file, unreadable, unparseable, wrong role, no
            # timestamp, stale, missing demand fields) -- a broken detector
            # must degrade to the pre-veto behaviour, never to a billable box
            # that can no longer be shut down.
            ORCH_INFO=$(AFFINITY="$AFFINITY" \
              ORCHESTRATOR_FRESH_MIN="${ORCHESTRATOR_FRESH_MIN}" \
              python3 -c "
          import json, os, sys
          from datetime import datetime, timezone
          aff = os.environ['AFFINITY']
          fresh = int(os.environ['ORCHESTRATOR_FRESH_MIN'])
          # 2026-09-01: source is the live-status branch snapshot (coordinator
          # /shadow/status rows), not the retired master heartbeat mirror.
          # The orchestrator's row is machine == '<aff>-metaworker'; its
          # POSTed progress dict carries role / demand / last_tick_utc.
          path = 'ree-assembly-live/fleet_status.json'
          now = datetime.now(timezone.utc)

          def out(veto, reason):
              print(f'orch_veto={veto} orch_reason={reason}')
              sys.exit(0)

          try:
              with open(path) as f:
                  doc = json.load(f)
          except FileNotFoundError:
              out(0, 'no_snapshot')
          except Exception as exc:
              out(0, f'snapshot_unreadable({type(exc).__name__})')
          rows = doc.get('machines') if isinstance(doc, dict) else None
          if not isinstance(rows, list):
              out(0, 'snapshot_no_machines')
          hb = None
          for r in rows:
              if isinstance(r, dict) and r.get('machine') == f'{aff}-metaworker':
                  prog = r.get('progress')
                  hb = dict(prog) if isinstance(prog, dict) else {}
                  hb.setdefault('last_tick_utc', r.get('last_seen'))
                  break
          if hb is None:
              out(0, 'no_orchestrator')
          if hb.get('role') != 'orchestrator':
              out(0, 'orchestrator_role_mismatch')
          try:
              tick = datetime.fromisoformat(
                  (hb.get('last_tick_utc') or '').replace('Z', '+00:00'))
          except Exception:
              out(0, 'orchestrator_no_tick')
          age_min = (now - tick).total_seconds() / 60.0
          if age_min > fresh:
              out(0, f'orchestrator_stale({int(age_min)}min>{fresh}min)')
          # FRESHNESS ALONE IS NOT A VETO -- a fresh heartbeat only says the
          # dispatch timer is ticking, which is always true on a box with the
          # timer enabled, and would make the box unconditionally always-on
          # with the shutdown branch unreachable. Demand is what vetoes.
          in_flight = hb.get('in_flight_dispatches')
          open_work = hb.get('chips_open_work')
          if not isinstance(in_flight, int) or not isinstance(open_work, int):
              out(0, 'orchestrator_no_demand_fields')
          if in_flight > 0:
              out(1, f'orchestrator_busy_in_flight={in_flight}_age={int(age_min)}min')
          if open_work > 0:
              out(1, f'orchestrator_backlog_chips_open_work={open_work}_age={int(age_min)}min')
          out(0, f'orchestrator_idle_and_empty_age={int(age_min)}min')
          ")
            ORCH_VETO=$(echo "$ORCH_INFO" | sed -n 's/^orch_veto=\([01]\) .*/\1/p')

            # DECLARED-ORCHESTRATOR membership -- a standing CONFIG fact, never
            # inferred from telemetry. Inferring it from "an orchestrator
            # heartbeat exists" is exactly the inference that deadlocked: an
            # OFF box publishes nothing, so it reads as "not an orchestrator"
            # and gets powered off before it can ever publish. Word-boundary
            # match so ree-cloud-4 never matches ree-cloud-40.
            IS_ORCHESTRATOR=0
            for _ORCH_AFF in ${ORCHESTRATOR_AFFINITIES}; do
              if [ "$_ORCH_AFF" = "$AFFINITY" ]; then IS_ORCHESTRATOR=1; fi
            done

            # Read heartbeat to decide whether the runner is genuinely idle.
            # idle_ok is "1" when:
            #   - heartbeat file exists and is fresh (last_tick_utc within HEARTBEAT_FRESH_MIN)
            #   - state == "idle"
            #   - current_exq is null
            #   - newest recent_completed.completed_at is older than IDLE_GRACE_MIN
            # OR the heartbeat is missing/very stale (> 1 hour) -- runner already dead,
            # safe to power off.
            IDLE_INFO=$(AFFINITY="$AFFINITY" \
              IDLE_GRACE_MIN="${IDLE_GRACE_MIN}" \
              HEARTBEAT_FRESH_MIN="${HEARTBEAT_FRESH_MIN}" \
              python3 -c "
          import json, os, sys
          from datetime import datetime, timezone, timedelta
          aff = os.environ['AFFINITY']
          grace = int(os.environ['IDLE_GRACE_MIN'])
          fresh = int(os.environ['HEARTBEAT_FRESH_MIN'])
          # 2026-09-01: source is the live-status branch snapshot (coordinator
          # /shadow/status rows), not the retired master heartbeat mirror.
          # Per-row last_seen carries the same fresh/aging/dead semantics the
          # old per-file last_tick_utc did; when the hub is down the snapshot
          # freezes and rows age together, exactly as the old hub-written
          # mirror froze. STRUCTURAL DIVERGENCE (c) vs the hub timer: the
          # coordinator rows carry no recent_completed history, so the
          # IDLE_GRACE_MIN window after a completion is NOT enforced here --
          # the HELD_BY_SELF guard covers mid-claim workers, and the hub
          # timer (fully authoritative, 5-min cadence, reads the DB directly)
          # still enforces the grace window.
          path = 'ree-assembly-live/fleet_status.json'
          now = datetime.now(timezone.utc)

          def parse_utc(s):
              if not s: return None
              try:
                  return datetime.fromisoformat(s.replace('Z','+00:00'))
              except Exception:
                  return None

          try:
              with open(path) as f:
                  doc = json.load(f)
              rows = doc.get('machines') or []
          except FileNotFoundError:
              # No snapshot at all: transport failure, not evidence anything
              # is dead. Conservative -- never shut down on a missing view.
              print('idle_ok=0 reason=snapshot_missing')
              sys.exit(0)
          except Exception as exc:
              print(f'idle_ok=0 reason=snapshot_unreadable_{type(exc).__name__}')
              sys.exit(0)

          hb = None
          for r in rows:
              if isinstance(r, dict) and r.get('machine') == aff:
                  hb = r
                  break
          if hb is None:
              # Machine has never heartbeated to the coordinator -- runner
              # not running (parity with the old missing-file branch).
              print('idle_ok=1 reason=no_heartbeat')
              sys.exit(0)

          last_tick = parse_utc(hb.get('last_seen'))
          state = hb.get('state')
          current_exq = hb.get('current_exq')

          # Heartbeat very stale -> runner dead; safe to shutdown
          if last_tick is None or (now - last_tick) > timedelta(hours=1):
              print('idle_ok=1 reason=heartbeat_stale')
              sys.exit(0)
          # Heartbeat moderately stale -> uncertain; do NOT shutdown
          if (now - last_tick) > timedelta(minutes=fresh):
              print('idle_ok=0 reason=heartbeat_aging')
              sys.exit(0)
          # Runner says it's working
          if state != 'idle' or current_exq is not None:
              print(f'idle_ok=0 reason=state_{state}_current_{current_exq}')
              sys.exit(0)
          print('idle_ok=1 reason=clean_idle')
          ")
            IDLE_OK=$(echo "$IDLE_INFO" | sed -n 's/^idle_ok=\([01]\) .*/\1/p')

            # Get current server status (off, running, starting, stopping, unknown)
            STATUS=$(hcloud server describe "$SERVER_NAME" -o format='{{.Status}}' 2>/dev/null || echo "unknown")

            # Stash per-affinity state so the surge-mode branch on a later
            # worker (cloud-4) can read sister-worker status (cloud-2 / cloud-3).
            WORKER_STATUS[$AFFINITY]="$STATUS"
            WORKER_HELD[$AFFINITY]="$HELD_BY_SELF"

            echo "[$SERVER_NAME affinity=$AFFINITY] claimable=$CLAIMABLE held_by_self=$HELD_BY_SELF status=$STATUS $IDLE_INFO $ORCH_INFO"

            if [ "$STATUS" = "unknown" ]; then
              echo "  -> server not provisioned yet, skipping"
              continue
            fi

            if [ "$CLAIMABLE" -gt 0 ] && [ "$STATUS" = "off" ] && [ "$MODE" = "full" ]; then
              echo "  -> queue has work, starting $SERVER_NAME"
              hcloud server poweron "$SERVER_NAME"
            elif [ "$STATUS" = "off" ] && [ "$MODE" = "surge" ]; then
              # Surge mode: cloud-4 powers on only when cloud-2 + cloud-3 are
              # both running with claims held AND queue depth >= threshold.
              # Designed to make cloud-4 the overflow before the laptop is
              # ever pulled in. Sister-worker state read from WORKER_STATUS /
              # WORKER_HELD populated above (cloud-2 + cloud-3 iterate first).
              CLOUD_2_STATUS="${WORKER_STATUS[ree-cloud-2]:-unknown}"
              CLOUD_2_HELD="${WORKER_HELD[ree-cloud-2]:-0}"
              CLOUD_3_STATUS="${WORKER_STATUS[ree-cloud-3]:-unknown}"
              CLOUD_3_HELD="${WORKER_HELD[ree-cloud-3]:-0}"
              if [ "$CLAIMABLE" -ge "$SURGE_QUEUE_THRESHOLD" ] \
                 && [ "$CLOUD_2_STATUS" = "running" ] && [ "$CLOUD_2_HELD" -gt 0 ] \
                 && [ "$CLOUD_3_STATUS" = "running" ] && [ "$CLOUD_3_HELD" -gt 0 ]; then
                echo "  -> surge conditions met (claimable=$CLAIMABLE>=$SURGE_QUEUE_THRESHOLD, cloud-2 running+held=$CLOUD_2_HELD, cloud-3 running+held=$CLOUD_3_HELD), starting $SERVER_NAME"
                hcloud server poweron "$SERVER_NAME"
              else
                echo "  -> surge mode but conditions not met (claimable=$CLAIMABLE/threshold=$SURGE_QUEUE_THRESHOLD, cloud-2=$CLOUD_2_STATUS/held=$CLOUD_2_HELD, cloud-3=$CLOUD_3_STATUS/held=$CLOUD_3_HELD)"
              fi
            elif [ "$CLAIMABLE" -gt 0 ] && [ "$STATUS" = "off" ] && [ "$MODE" = "shutdown-only" ]; then
              echo "  -> queue has work but $SERVER_NAME is shutdown-only (manual start required)"
            elif [ "$HELD_BY_SELF" -gt 0 ] && [ "$STATUS" = "running" ]; then
              # Worker is holding an active claim. Do NOT shutdown even when
              # CLAIMABLE=0 and IDLE_OK=1 (e.g. heartbeat_stale because a long
              # experiment hasn't refreshed it). Authoritative invariant:
              # claimed-and-not-completed beats every shutdown signal.
              # 2026-05-30 fleet incident guard.
              echo "  -> worker holds $HELD_BY_SELF active claim(s), keeping $SERVER_NAME running"
            elif [ "$IS_ORCHESTRATOR" = "1" ] && [ "$STATUS" = "running" ]; then
              # DECLARED ORCHESTRATOR BOX -- this backstop holds no shutdown
              # authority here. See env.ORCHESTRATOR_AFFINITIES for why: this
              # path can only read the git heartbeat and cannot see the
              # coordinator row or the hub-local wake state, so it cannot
              # distinguish a booting or a busy dispatcher from a dead one.
              # Placed ABOVE the ORCH_VETO branch on purpose -- it must hold
              # even when the git heartbeat says the box is idle and empty.
              echo "  -> $AFFINITY is a declared orchestrator box; this backstop does not shut it down (hub cloud-scaler.timer is authoritative). orch=$ORCH_INFO"
            elif [ "$ORCH_VETO" = "1" ] && [ "$STATUS" = "running" ]; then
              # ORCHESTRATOR VETO. This box is also running metaworker-dispatch,
              # which creates no queue claim and no runner heartbeat -- so every
              # other signal here reads clean_idle while live `claude -p` workers
              # are mid-flight. Fires on live workers (strong) or on chip backlog
              # this box would pick up (weak); an idle metaworker with an empty
              # ledger does NOT veto and falls through to the ordinary shutdown
              # test below, which independently requires CLAIMABLE=0. So the box
              # stops only when BOTH planes are empty. Bounded by
              # ORCHESTRATOR_FRESH_MIN so a dead metaworker stops vetoing rather
              # than pinning a billable box forever.
              # 2026-08-19 ree-worker-4 incident guard -- see workflow header.
              echo "  -> $AFFINITY is running metaworker-dispatch, keeping $SERVER_NAME running ($ORCH_INFO)"
            elif [ "$CLAIMABLE" -eq 0 ] && [ "$STATUS" = "running" ] && [ "$IDLE_OK" = "1" ]; then
              echo "  -> no matching work AND runner idle past grace window, shutting down $SERVER_NAME"
              # Announce shutdown to the coordinator BEFORE issuing hcloud
              # shutdown, so lifecycle_state flips to gracefully_offline
              # immediately rather than waiting on the runner's SIGTERM
              # handler (which would miss this signal if the runner is
              # already crashed). Best-effort: a failed announcement does
              # NOT block the actual shutdown.
              if [ "${HUB_SSH_READY:-0}" = "1" ]; then
                ssh -o StrictHostKeyChecking=accept-new \
                    -o ConnectTimeout=10 -o BatchMode=yes \
                    -i ~/.ssh/hub_key \
                    "${HUB_SSH_USER}@${HUB_SSH_HOST}" \
                    "/usr/local/bin/coordinator_announce_shutdown.sh '$AFFINITY'" \
                    && echo "    [scaler] announced shutdown_notify for $AFFINITY" \
                    || echo "    [scaler] WARN: shutdown_notify announce failed for $AFFINITY (proceeding)"
              fi
              # shutdown (not poweroff) so systemd sends SIGTERM for graceful drain
              hcloud server shutdown "$SERVER_NAME"
            else
              echo "  -> no action needed"
            fi
          done
