name: Contract Test Suite

# Post-push defence-in-depth for the executable-code plane (ree_core/,
# coordinator/, experiments/). Closes a real gap: the ~2100-test contract
# suite is otherwise only run (a) locally via the PreToolUse pre-commit hook
# (scripts/precommit_contracts.sh), which depends on that hook being
# installed and in sync across every worktree -- documented as drifting
# silently (CLAUDE.md "Housekeeping" step 5a) -- and is skippable with
# --no-verify; or (b) manually via scripts/remote_pytest.sh on a cloud
# worker, which nothing forces anyone to run before a push actually lands.
# Neither is a check on the pushed commit itself. This workflow is that
# check, mirroring the queue-validate.yml pattern: fresh clone, no
# session-local state, fails loudly on the push instead of relying on
# discipline.
#
# Scope: this repo is split into a coordination-data plane (experiment_queue.json,
# written continuously by phase3 writers -- see CLAUDE.md "Why trunk-only")
# and an executable-code plane (ree_core/, coordinator/). Triggers are
# path-filtered to the code plane so this doesn't fire on every automated
# queue-snapshot commit, which would otherwise dominate the trigger volume.
#
# Runs on ubuntu-latest (linux-x86_64), matching the cloud fleet's machine
# class -- NOT the Mac's darwin-arm64. This matters: torch.multinomial is not
# bit-identical across machine classes (see reference-cross-machine-class-
# contract-divergence memory / requirements.txt), so a worker-green suite is
# a meaningful gate here in a way a Mac-local run would not be. Contracts
# that assert exact committed actions were already de-flaked to not depend
# on this.
#
# NOTE (2026-07-27, first run): the initial run on ubuntu-latest surfaced
# one pre-existing, environment-independent finding this workflow is
# working as intended to catch -- see WORKSPACE_STATE.md / chipped
# follow-on tasks rather than this comment for status:
#   1. tests/preflight/test_queue_integrity.py::test_supersedes_targets_well_formed
#      -- V3-EXQ-826a's `supersedes` field holds a run_id string, not the
#      expected queue_id shape. A real experiment_queue.json data defect.
#
# RESOLVED (2026-07-27/28): tests/contracts/test_runner_manifest_survives_
# conflict_recovery.py (C1/C2/C3) failed here but passed on darwin-arm64.
# Root cause was a real bug, not a git-version quirk: git_push_results'
# initial `git commit` was never checked for success, and GitHub's
# ubuntu-latest runner has no git identity configured and no GECOS full
# name for git to auto-derive one from -- so that commit failed outright
# (exit 128), the manifest never entered a commit, and the later
# `git checkout <pre_reset_sha> -- <path>` restore step correctly reported
# a missing pathspec because pre_reset_sha genuinely never contained the
# manifest. Fixed in experiment_runner.py (_git_commit identity-fallback
# retry, commit 49668c4) with a C4 regression test that reproduces the
# no-identity failure host-independently. Every currently-live production
# host was checked directly and has identity configured, so this had not
# fired in production.
#
# RESOLVED (2026-09-18): tests/contracts/test_runner_git_pull_ephemeral_
# conflict_recovery.py failed C1/C2/C3/C4/C6/C7 here while green on
# darwin-arm64 and on every production box. TWO independent causes behind
# those six, which is why they needed separating rather than one root cause:
# C1/C2/C3/C4/C6 were TEST drift (the file asserted on git's prose), while
# C7 alone was a REAL production bug -- same shape as the 2026-07-27 case
# above, and again not a runner quirk. ubuntu-24.04
# ships git 2.55.0; the Mac has 2.51.2 and the hub/workers 2.34.1. git
# REWORDED its autostash-pop-conflict message somewhere in between --
#   2.51.2: "Applying autostash resulted in conflicts."
#   2.55.0: "Your local changes are stashed, however applying them"
#           "resulted in conflicts.  You can either ..."
# -- and experiment_runner.git_pull gated its ephemeral-conflict recovery on
# the literal substring "autostash resulted in conflicts", which does not
# occur in the new text at all (the line break falls between "them" and
# "resulted"). On a new enough git the recovery therefore never fired and the
# 2026-05-31 cloud-3 wedge re-armed silently. Only THIS workflow was on a git
# new enough to see it. Fixed by deciding on git STATE
# (_list_unmerged_paths) instead of message wording -- which every other
# branch of git_pull already did -- plus contract C10, which mutes the
# conflict prose out of git's output entirely so the pin holds on any git
# version, old or future.

on:
  push:
    branches:
      - main
      - 'integration/**'
    paths:
      - 'ree_core/**'
      - 'coordinator/**'
      - 'experiments/**'
      - 'tests/**'
      - 'graceful_timeout.py'
      - 'validate_queue.py'
      - 'validate_experiments.py'
      - 'requirements.txt'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  contracts:
    runs-on: ubuntu-latest
    # 60, raised from 30 on 2026-09-18, because THREE of the eight runs before
    # this change were `cancelled` at ~30m18s -- and a cancelled run is
    # indistinguishable at a glance from one that never mattered, so the gate
    # was already failing open.
    #
    # WHAT THIS BUYS, stated so the next session does not re-derive it -- and
    # budget against the SLOW case, because a timeout has to survive the worst
    # run, not the median. RUNNER SPEED VARIES FAR MORE THAN THE SUITE GROWS:
    #   run 35280511927  5240 tests  1626.80s (27m07s)  ~0.31 s/test
    #   run 35338932137  5254 tests  2244.13s (37m24s)  ~0.43 s/test
    # Fourteen more tests, 38% more wall clock, hours apart on ubuntu-24.04
    # 4-vCPU runners. So the first figure is not a baseline, it is the lucky
    # end of a wide distribution -- do not quote it on its own.
    #
    # At the SLOW rate the suite already eats 62% of this 60-minute budget.
    # Measured growth in tests/ (count of `def test_` at dated commits on
    # origin/main): 3686 -> 4736 over the 30 days to 2026-09-18 = ~35 defs/day,
    # ~49/day over the 60-day window; at ~1.11 collected tests per def and
    # ~0.43 s/test that is ~17 s of added runtime per day. Remaining headroom
    # is therefore ~1300s, i.e. roughly 2.5-3 months (~78 days), NOT the 4-5
    # an 0.31 s/test baseline suggests.
    #
    # THIS IS A DEADLINE, NOT A FIX -- any fixed number is. It runs out around
    # 2026-12. The structural options, in preference order, are (a) shard
    # the job across a matrix of runners, or (b) pytest-xdist `-n auto
    # --dist loadfile` within the job (public repo => 4-vCPU runners, so ~2.5-3x
    # is available). Both were deliberately NOT taken here: this change is on
    # the critical path of getting the gate green again, and an untested
    # parallelism change to the ONE post-merge check for the code plane risks
    # introducing flakiness -- a gate that is green because it became unreliable
    # is the same failure as one that is green because it stopped checking.
    # `--durations=25` below is the standing instrumentation for making that
    # choice on data instead of guesswork.
    #
    # ~103s OF THAT DEADLINE WAS BOUGHT BACK THE SAME DAY, WITHOUT PARALLELISM
    # AND WITHOUT NARROWING ANYTHING. `--durations=25` did its job: the largest
    # single line in the suite was
    #   200.47s setup tests/contracts/test_agent_construction_seed_order_lint.py::
    #                 test_corpus_fire_rate_is_pinned
    # -- ~11% of wall clock, six times the next entry. That is not one test: it
    # is the session-scoped `corpus_scan` fixture (tests/contracts/conftest.py),
    # attributed to whichever consumer happens to trigger it first. Profiling it
    # per consumer showed the parse was already shared and the TRAVERSAL was the
    # cost: 21 corpus lints each re-walking the one shared tree. Memoising that
    # walk took the fixture 186.11s -> 82.57s on an idle hub, with every lint's
    # fire list identical. Because the cost is O(corpus x lints) rather than
    # O(tests), it does NOT come back with test growth the way the ~12-17 s/day
    # above does -- but a new corpus-wide lint does add to it, so it stays worth
    # watching in `--durations`. The sharding/xdist decision below is deferred,
    # not cancelled.
    #
    # DO NOT buy time by narrowing the collected set. A suite that is not run
    # is not a gate. (This job already runs only `tests/`, while
    # scripts/remote_pytest.sh --selftest pins SIX collection roots --
    # coordinator/, dispatch/ and three loose test_*.py files are NOT covered
    # here. Widening it is owed work, and it costs runtime, so it needs the
    # sharding decision above first.)
    timeout-minutes: 60
    steps:
      # actions/checkout's `path` input refuses to resolve outside
      # $GITHUB_WORKSPACE (a security guard -- `../REE_assembly` errors
      # with "is not under ..."), so a true sibling of the default
      # checkout dir isn't reachable directly. Instead nest BOTH repos as
      # siblings inside the workspace ($GITHUB_WORKSPACE/ree-v3 and
      # $GITHUB_WORKSPACE/REE_assembly) and run pytest with
      # working-directory: ree-v3, so tests/contracts/test_arm_reuse.py's
      # sibling-repo resolution (ree_v3_root.parent contains REE_assembly)
      # sees the same shape it expects from a real REE_Working checkout.
      - name: Checkout ree-v3
        uses: actions/checkout@v4
        with:
          path: ree-v3
          fetch-depth: 1

      - name: Checkout REE_assembly as a sibling
        uses: actions/checkout@v4
        with:
          repository: Latent-Fields/REE_assembly
          path: REE_assembly
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (canonical fleet build -- see requirements.txt)
        working-directory: ree-v3
        run: |
          python3 -m pip install --upgrade pip
          pip install numpy pytest
          pip install "torch==2.12.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Run contract test suite
        working-directory: ree-v3
        run: |
          nproc
          # --durations=25 is instrumentation, not decoration: it is what turns
          # "the suite is getting slow" into a ranked list of where the time
          # actually goes, and it is the input to the shard-vs-xdist decision
          # recorded on timeout-minutes above. It costs nothing.
          python3 -m pytest tests/ -q --durations=25
